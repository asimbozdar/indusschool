<style>
  :root{
    --navy:#16303a;
    --navy-2:#1f4550;
    --paper:#f6f2e9;
    --paper-2:#efe8d8;
    --gold:#b8863b;
    --gold-2:#d6a35c;
    --ink:#1c2b2f;
    --muted:#697a7c;
    --line:#dcd3bd;
    --green:#3e6a4f;
    --red:#a2452f;
    --white:#fffdf8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  h1,h2,h3,h4{font-family:Georgia,'Times New Roman',serif;margin:0;}
  .app{display:flex;min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:230px;flex-shrink:0;
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);
    color:var(--paper);
    padding:26px 18px;
    display:flex;flex-direction:column;
    position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .brand .seal{
    width:38px;height:38px;border-radius:50%;
    border:2px solid var(--gold-2);
    display:flex;align-items:center;justify-content:center;
    font-family:Georgia,'Times New Roman',serif;font-weight:700;color:var(--gold-2);font-size:15px;
    flex-shrink:0;
  }
  .brand-text{line-height:1.2;}
  .brand-text .t1{font-family:Georgia,'Times New Roman',serif;font-size:14.5px;font-weight:600;color:var(--white);}
  .brand-text .t2{font-size:10.5px;color:var(--gold-2);letter-spacing:.04em;text-transform:uppercase;}
  .school-line{font-size:10.5px;color:#a9bdbf;margin:10px 0 22px;padding-bottom:16px;border-bottom:1px solid rgba(255,255,255,.12);}

  nav{display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:8px;cursor:pointer;
    font-size:13.5px;color:#cfe0e1;font-weight:500;
    transition:.15s;border-left:3px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.06);}
  .nav-item.active{background:rgba(214,163,92,.14);color:var(--white);border-left:3px solid var(--gold-2);}
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#7d9698;margin:16px 0 6px 12px;}

  .sidebar-foot{font-size:10px;color:#7d9698;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);line-height:1.5;}

  /* Main */
  main{flex:1;padding:30px 38px;max-width:1280px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px;}
  .page-head h1{font-size:24px;color:var(--navy);}
  .page-head .sub{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .eyebrow{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:3px;}

  .btn{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;font-weight:600;
    padding:9px 16px;border-radius:7px;border:1px solid var(--navy);
    background:var(--navy);color:var(--white);cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .btn:hover{background:var(--navy-2);}
  .btn.gold{background:var(--gold);border-color:var(--gold);}
  .btn.gold:hover{background:var(--gold-2);}
  .btn.outline{background:transparent;color:var(--navy);}
  .btn.outline:hover{background:rgba(22,48,58,.06);}
  .btn.sm{padding:6px 11px;font-size:11.5px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Cards / stats */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;position:relative;overflow:hidden;
  }
  .stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
  .stat-card .num{font-family:Georgia,'Times New Roman',serif;font-size:28px;font-weight:600;color:var(--navy);}
  .stat-card .lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  .stat-card .split{display:flex;gap:10px;margin-top:8px;font-size:11px;color:var(--muted);}
  .stat-card .split b{color:var(--ink);}

  .panel{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:20px;}
  .panel h3{font-size:15px;color:var(--navy);margin-bottom:14px;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);padding:8px 10px;border-bottom:1.5px solid var(--line);font-weight:600;}
  td{padding:9px 10px;border-bottom:1px solid var(--paper-2);}
  tr:hover td{background:var(--paper);}
  .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .tag.promoted{background:#e4efe7;color:var(--green);}
  .tag.dropout{background:#f6e5df;color:var(--red);}
  .tag.pasout{background:#e6ecf6;color:#3a5a9a;}
  .tag.new{background:#f7ecd8;color:var(--gold);}

  .filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  select,input[type=text],input[type=search]{
    font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12.5px;padding:8px 11px;
    border:1px solid var(--line);border-radius:7px;background:var(--white);color:var(--ink);
  }
  select:focus,input:focus{outline:2px solid var(--gold-2);outline-offset:1px;}

  .avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--paper-2);border:1px solid var(--line);flex-shrink:0;}
  .avatar.placeholder{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted);font-weight:600;}
  .name-cell{display:flex;align-items:center;gap:9px;}

  .checkbox-cell{width:30px;}

  .empty-state{text-align:center;padding:50px 20px;color:var(--muted);}
  .empty-state svg{width:40px;height:40px;color:var(--line);margin-bottom:10px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(22,30,32,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
  .modal{background:var(--white);border-radius:14px;max-width:620px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;}
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal-close{cursor:pointer;background:none;border:none;font-size:20px;color:var(--muted);line-height:1;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
  .field label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:5px;font-weight:600;}
  .field input,.field select{width:100%;}
  .photo-upload{display:flex;align-items:center;gap:14px;margin-bottom:16px;padding:14px;background:var(--paper);border-radius:10px;border:1px dashed var(--line);}
  .photo-upload .avatar{width:64px;height:64px;font-size:18px;}
  .subject-row{display:grid;grid-template-columns:1.6fr .7fr .7fr .7fr;gap:8px;align-items:center;margin-bottom:8px;font-size:12.5px;}
  .subject-row input{width:100%;}
  .toast{position:fixed;bottom:22px;right:22px;background:var(--navy);color:var(--white);padding:12px 18px;border-radius:9px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:200;display:none;}

  .pill-select{display:flex;gap:8px;flex-wrap:wrap;}
  .pill-select label{
    border:1px solid var(--line);border-radius:20px;padding:6px 14px;font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;background:var(--white);
  }
  .pill-select input{margin:0;}
  .pill-select label.checked{border-color:var(--gold);background:#fbf4e6;color:var(--gold);font-weight:600;}

  .helper{font-size:11.5px;color:var(--muted);line-height:1.5;}
  .divider{height:1px;background:var(--line);margin:18px 0;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
</style>
</head>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const BASE_STUDENTS = JSON.parse(document.getElementById('students-data').textContent);
const CLASS_ORDER = ['VI','VII','VIII','IX','X'];
let STUDENTS = [];
let studentEdits = {};     // grNo -> {field: newValue, ...}
let studentAdds = [];      // array of new student objects
let studentDeletes = [];   // array of grNo marked deleted

function sortStudents(list){
  list.sort((a,b)=> CLASS_ORDER.indexOf(a.currentClass)-CLASS_ORDER.indexOf(b.currentClass) || (a.section||'').localeCompare(b.section||'') || a.name.localeCompare(b.name));
  return list;
}

function rebuildStudents(){
  let list = BASE_STUDENTS
    .filter(s=> !studentDeletes.includes(s.grNo))
    .map(s=> studentEdits[s.grNo] ? {...s, ...studentEdits[s.grNo]} : s);
  list = list.concat(studentAdds.filter(s=> !studentDeletes.includes(s.grNo)));
  STUDENTS = sortStudents(list);
}
rebuildStudents();

/* ============ UNIVERSAL STORAGE (Claude artifact storage, or IndexedDB when running standalone / as an installed app) ============ */
let _idbPromise = null;
function idbOpen(){
  if(_idbPromise) return _idbPromise;
  _idbPromise = new Promise((resolve, reject)=>{
    const req = indexedDB.open('indus_school_system_db', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('kv'); };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
  return _idbPromise;
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readonly');
    const req = tx.objectStore('kv').get(key);
    req.onsuccess = ()=> resolve(req.result===undefined ? null : {key, value:req.result});
    req.onerror = ()=> reject(req.error);
  });
}
async function idbSet(key, value){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('kv','readwrite');
    tx.objectStore('kv').put(value, key);
    tx.oncomplete = ()=> resolve({key, value});
    tx.onerror = ()=> reject(tx.error);
  });
}
const HAS_CLAUDE_STORAGE = (typeof window.storage !== 'undefined' && typeof window.storage.get === 'function');
const appStorage = {
  async get(key){
    if(HAS_CLAUDE_STORAGE){ try{ return await window.storage.get(key); }catch(e){ /* fall through */ } }
    return idbGet(key);
  },
  async set(key, value){
    if(HAS_CLAUDE_STORAGE){ try{ return await window.storage.set(key, value); }catch(e){ /* fall through */ } }
    return idbSet(key, value);
  }
};

function showToast(msg){
  const t = document.getElementById('toast');

}

/* ============ HELPERS ============ */
function activeStudents(){ return STUDENTS.filter(s=>s.status!=='Dropout' && s.status!=='Pasout'); }
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function U(v){ return (v==null?'':String(v)).toUpperCase(); }
function statusTagClass(s){
  if(s==='Promoted') return 'promoted';
  if(s==='Dropout') return 'dropout';
  if(s==='Pasout') return 'pasout';
  return 'new';
}
function filteredStudents(){
  return STUDENTS.filter(s=>{
    if(filters.cls!=='ALL' && s.currentClass!==filters.cls) return false;
    if(filters.section!=='ALL' && s.section!==filters.section) return false;
    if(filters.status!=='ALL' && s.status!==filters.status) return false;
    if(filters.q){
      const q = filters.q.toLowerCase();
      if(!(s.name.toLowerCase().includes(q) || s.fatherName.toLowerCase().includes(q) || s.grNo.includes(q))) return false;
    }
    return true;
  });
}
function classSections(cls){
  return [...new Set(STUDENTS.filter(s=>cls==='ALL'||s.currentClass===cls).map(s=>s.section))].sort();
}

/* ============ DASHBOARD ============ */
function computeSummary(){
  const rows = [];
  let gT={Male:0,Female:0}, rT={};
  let totalActive=0;
  CLASS_ORDER.forEach(cls=>{
    const arr = STUDENTS.filter(s=>s.currentClass===cls && s.status!=='Dropout' && s.status!=='Pasout');
    if(!arr.length) return;
    const male = arr.filter(s=>s.gender==='Male').length;
    const female = arr.filter(s=>s.gender==='Female').length;
    const religions = {};
    arr.forEach(s=>{ religions[s.religion||'Other'] = (religions[s.religion||'Other']||0)+1; });
    rows.push({cls, total:arr.length, male, female, religions});
    gT.Male+=male; gT.Female+=female; totalActive+=arr.length;
    Object.entries(religions).forEach(([k,v])=> rT[k]=(rT[k]||0)+v);
  });
  return {rows, gT, rT, totalActive};
}

function exportSummaryPDF(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const {rows, gT, rT, totalActive} = computeSummary();
  const pageW = doc.internal.pageSize.getWidth();
  let y = 55;

  doc.setFont('times','bold'); doc.setFontSize(17);
  doc.text(SCHOOL_NAME, pageW/2, y, {align:'center'}); y+=20;
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(90);
  doc.text(`School Code: ${SCHOOL_META.code}  |  ${SCHOOL_META.village}, ${SCHOOL_META.taluka}, ${SCHOOL_META.district}`, pageW/2, y, {align:'center'}); y+=25;
  doc.setDrawColor(184,134,59); doc.setLineWidth(1.2); doc.line(50,y,pageW-50,y); y+=25;

  doc.setTextColor(20); doc.setFont('times','bold'); doc.setFontSize(13);
  doc.text('Enrollment Summary Report', pageW/2, y, {align:'center'}); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(120);
  doc.text('Generated on ' + new Date().toLocaleDateString('en-GB') + '  ·  Pasout/Dropout excluded from enrollment counts', pageW/2, y+12, {align:'center'});
  y += 34;

  const religionCols = Object.keys(rT);
  const head = [['Class','Total','Male','Female', ...religionCols]];
  const body = rows.map(r=>[r.cls, r.total, r.male, r.female, ...religionCols.map(rc=>r.religions[rc]||0)]);
  body.push(['Total', totalActive, gT.Male, gT.Female, ...religionCols.map(rc=>rT[rc]||0)]);

  y = autoTableSimple(doc, y, head, body, pageW);
  y += 26;

  doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(20);
  doc.text('Overall Gender Split', 50, y); y += 16;
  y = autoTableSimple(doc, y, [['Gender','Count','Percentage']], [
    ['Male', gT.Male, ((gT.Male/totalActive)*100).toFixed(1)+'%'],
    ['Female', gT.Female, ((gT.Female/totalActive)*100).toFixed(1)+'%'],
  ], pageW);
  y += 26;

  if(y > 620){ doc.addPage(); y = 55; }
  doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(20);
  doc.text('Overall Religion Split', 50, y); y += 16;
  y = autoTableSimple(doc, y, [['Religion','Count','Percentage']],
    religionCols.map(rc=>[rc, rT[rc], ((rT[rc]/totalActive)*100).toFixed(1)+'%']), pageW);
  y += 26;

  const pasoutTotal = STUDENTS.filter(s=>s.status==='Pasout').length;
  const dropoutTotal = STUDENTS.filter(s=>s.status==='Dropout').length;
  if(pasoutTotal || dropoutTotal){
    if(y > 600){ doc.addPage(); y = 55; }
    doc.setFont('times','bold'); doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Pasout & Dropout — Quantity (kept separate)', 50, y); y += 16;
    const psRows = CLASS_ORDER.map(cls=>{
      const p = STUDENTS.filter(s=>s.currentClass===cls && s.status==='Pasout').length;
      const d = STUDENTS.filter(s=>s.currentClass===cls && s.status==='Dropout').length;
      return (p||d) ? [cls, p, d] : null;
    }).filter(Boolean);
    psRows.push(['Total', pasoutTotal, dropoutTotal]);
    autoTableSimple(doc, y, [['Class','Pasout','Dropout']], psRows, pageW);
  }

  doc.save(`Enrollment_Summary_${SCHOOL_META.code}.pdf`);
  showToast('Enrollment summary PDF downloaded');
}

/* Minimal manual table renderer (no plugin dependency) */
function autoTableSimple(doc, startY, head, body, pageW){
  const marginX = 50;
  const usableW = pageW - marginX*2;
  const cols = head[0].length;
  const colW = usableW/cols;
  let y = startY;
  doc.setFillColor(22,48,58);
  doc.rect(marginX, y-12, usableW, 20, 'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  head[0].forEach((h,i)=> doc.text(String(h), marginX+8+i*colW, y+2));
  y += 22;
  doc.setFont('helvetica','normal'); doc.setTextColor(30); doc.setFontSize(9.5);
  body.forEach((row,ri)=>{
    if(y > 760){ doc.addPage(); y = 55; }
    if(ri===body.length-1){ doc.setFont('helvetica','bold'); doc.setFillColor(246,242,233); doc.rect(marginX, y-12, usableW, 18, 'F'); }
    row.forEach((c,i)=> doc.text(String(c), marginX+8+i*colW, y));
    doc.setDrawColor(220,211,189); doc.line(marginX, y+5, marginX+usableW, y+5);
    y += 20;
  });
  return y;
}

function normName(s){ return (s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

async function handleBulkPhotos(e){
  const files = Array.from(e.target.files || []);
  if(!files.length) return;
  let matched=0, unmatched=[];
  for(const file of files){
    const base = file.name.replace(/\.[^.]+$/,'');
    // try match by roll number (Gr#) appearing in filename, else by normalized name
    let student = STUDENTS.find(s=> s.grNo && base.includes(s.grNo) );
    if(!student){
      const nb = normName(base);
      student = STUDENTS.find(s=> nb.includes(normName(s.name)) && s.name.length>2);
    }
    if(student){
      const dataUrl = await fileToDataURL(file);
      photos[student.grNo] = dataUrl;
      matched++;
    } else {
      unmatched.push(file.name);
    }
  }
  await savePhotos();
  renderStudentsTableOnly();
  if(unmatched.length){
    showToast(`Matched ${matched} photos. ${unmatched.length} unmatched — rename files to include Roll No.`);
  } else {
    showToast(`Matched and saved ${matched} photos.`);
  }
}
function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=reject;
    r.readAsDataURL(file);
  });
}

/* ============ STUDENT DATA MANAGEMENT (Add / Edit / Delete) ============ */
function isBaseStudent(grNo){ return BASE_STUDENTS.some(s=>s.grNo===grNo); }

async function upsertStudent(grNo, patch){
  if(isBaseStudent(grNo)){
    studentEdits[grNo] = { ...(studentEdits[grNo]||{}), ...patch };
  } else {
    const idx = studentAdds.findIndex(s=>s.grNo===grNo);
    if(idx>=0) studentAdds[idx] = { ...studentAdds[idx], ...patch };
  }
  rebuildStudents();
  await saveStudentData();
}

async function addNewStudent(data){
  studentAdds.push(data);
  rebuildStudents();
  await saveStudentData();
}

async function deleteStudent(grNo){
  if(!studentDeletes.includes(grNo)) studentDeletes.push(grNo);
  rebuildStudents();
  await saveStudentData();
}

async function undoDeleteStudent(grNo){
  studentDeletes = studentDeletes.filter(g=>g!==grNo);
  rebuildStudents();
  await saveStudentData();
}

function suggestNextGrNo(){
  const nums = [...BASE_STUDENTS, ...studentAdds].map(s=>parseInt(s.grNo,10)).filter(n=>!isNaN(n));
  const max = nums.length ? Math.max(...nums) : 0;
  return String(max+1);
}

function showUndoToast(msg, onUndo){
  const t = document.getElementById('toast');
  t.innerHTML = `<span>${msg}</span> <button id="toastUndoBtn" style="margin-left:10px;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;padding:3px 10px;font-size:11px;cursor:pointer;">Undo</button>`;
  t.style.display='block';
  document.getElementById('toastUndoBtn').addEventListener('click', async ()=>{ await onUndo(); t.style.display='none'; render(); });
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>t.style.display='none', 6000);
}

function csvEscape(v){
  const s = String(v==null?'':v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}

function exportStudentsCSV(){
  const cols = ['grNo','name','fatherName','gender','dob','admitClass','currentClass','section','religion','address','contact','emergencyContact','admissionDate','shift','medium','status','district','taluka','village'];
  const list = filteredStudents();
  const rows = [cols.join(',')];
  list.forEach(s=> rows.push(cols.map(c=>csvEscape(s[c])).join(',')));
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `Students_Export_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Exported ${list.length} student records to CSV`);
}

  <div class="modal-backdrop" id="mBackdrop">
    <div class="modal">
      <div class="modal-head">
        <div><div class="eyebrow">${rcExamName}</div><h3>${s.name} — Marks Entry</h3></div>

      </div>

  let subjects = JSON.parse(JSON.stringify(existing.subjects));
  function redrawRows(){
    document.getElementById('subjectRows').innerHTML = subjects.map((sub,i)=>`
      <div class="subject-row">
        <input type="text" data-field="name" data-i="${i}" value="${sub.name}">
        <input type="number" data-field="total" data-i="${i}" value="${sub.total}">

        <button class="btn outline sm" data-remove="${i}">✕</button>
      </div>`).join('');
    wireRows();

  function wireRows(){
    document.querySelectorAll('#subjectRows input').forEach(inp=>{
      inp.addEventListener('input', e=>{

      });

function generateReportCardsPDF(){
  if(!selected.size) return;
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const ids = [...selected];
  ids.forEach((grNo, idx)=>{
    if(idx>0) doc.addPage();
    drawReportCardPage(doc, grNo);
  });
  doc.save(`Report_Cards_${rcExamName.replace(/\s+/g,'_')}.pdf`);
  showToast(`Generated ${ids.length} report card(s)`);
}

function drawReportCardPage(doc, grNo){
  const s = STUDENTS.find(x=>x.grNo===grNo);
  const key = `${grNo}__${rcExamName}`;
  const data = marksStore[key] || { subjects: DEFAULT_SUBJECTS.map(n=>({name:n, total:100, obtained:''})) };
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 55;
  let y = 60;

  doc.setDrawColor(184,134,59); doc.setLineWidth(2);
  doc.rect(30,30,pageW-60, doc.internal.pageSize.getHeight()-60);

  try{ doc.addImage(SCHOOL_LOGO, 'PNG', marginX-15, 40, 46, 46); }catch(e){}

  doc.setFont('times','bold'); doc.setFontSize(18); doc.setTextColor(22,48,58);
  doc.text(SCHOOL_NAME, pageW/2, y, {align:'center'}); y+=18;
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(100);
  doc.text(`${SCHOOL_META.village}, ${SCHOOL_META.taluka}, ${SCHOOL_META.district}`, pageW/2, y, {align:'center'}); y+=18;
  doc.setFont('times','bold'); doc.setFontSize(13); doc.setTextColor(184,134,59);
  doc.text(`REPORT CARD — ${rcExamName}`, pageW/2, y, {align:'center'}); y+=28;

  // photo box
  if(photos[grNo]){
    try{ doc.addImage(photos[grNo], imgFormat(photos[grNo]), pageW-135, y-14, 70, 70); }catch(e){}
  } else {
    doc.setDrawColor(220,211,189); doc.rect(pageW-135, y-14, 70, 70);
    doc.setFontSize(8); doc.setTextColor(150); doc.text('PHOTO', pageW-100, y+22, {align:'center'});
  }

  doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(30);
  const info = [
    ['Student Name', s.name], ['Father Name', s.fatherName],
    ['Roll No.', s.grNo], ['Class / Section', `${s.currentClass} - ${s.section}`],
    ['Gender', s.gender], ['Date of Birth', s.dob],
  ];
  info.forEach(([lbl,val],i)=>{
    doc.setFont('helvetica','bold'); doc.text(lbl+':', marginX, y+i*17);
    doc.setFont('helvetica','normal'); doc.text(String(val), marginX+110, y+i*17);
  });
  y += info.length*17 + 20;

  // marks table
  const totalW = pageW - marginX*2 - 90;
  const cols = [totalW*0.5, totalW*0.17, totalW*0.17, totalW*0.16];
  const headers = ['Subject','Total Marks','Obtained','Grade'];
  doc.setFillColor(22,48,58); doc.rect(marginX, y-13, totalW, 20, 'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
  let x = marginX+8;
  headers.forEach((h,i)=>{ doc.text(h, x, y); x+=cols[i]; });
  y+=20;
  doc.setFont('helvetica','normal'); doc.setTextColor(30);
  let sumObt=0, sumTot=0;
  data.subjects.forEach(sub=>{
    const obt = sub.obtained===''||sub.obtained==null ? null : +sub.obtained;
    const pct = obt!=null && sub.total ? (obt/sub.total*100) : null;
    const grade = pct==null ? '-' : pct>=80?'A+':pct>=70?'A':pct>=60?'B':pct>=50?'C':pct>=40?'D':'F';
    x = marginX+8;
    const rowVals = [sub.name, String(sub.total), obt==null?'-':String(obt), grade];
    rowVals.forEach((v,i)=>{ doc.text(v, x, y); x+=cols[i]; });
    doc.setDrawColor(220,211,189); doc.line(marginX,y+5,marginX+totalW,y+5);
    if(obt!=null){ sumObt+=obt; sumTot+=(+sub.total||0); }
    y+=19;
  });
  y+=6;
  doc.setFont('helvetica','bold');
  doc.text(`Total: ${sumObt} / ${sumTot}`, marginX, y);
  const overallPct = sumTot? (sumObt/sumTot*100).toFixed(1) : '-';
  doc.text(`Percentage: ${overallPct}%`, marginX+220, y);
  y+=35;

  doc.setFont('helvetica','normal'); doc.setFontSize(9.5); doc.setTextColor(90);
  doc.text('Class Teacher: ______________________', marginX, y);
  doc.text('Principal: ______________________', pageW-marginX-160, y);
}

/* ============ CERTIFICATES VIEW ============ */
const CERT_TYPES = {
  character: { label:'Character Certificate' },
  bonafide: { label:'Bonafide Certificate' },
  leaving: { label:'School Leaving Certificate' },
  study: { label:'Study Certificate' },
  bispSlip: { label:'BISP School/College Verification Slip' },
};
let certType = 'character';
let certFilters = { cls:'VI', section:'ALL', status:'ALL' };
function certMatches(s){
  return (certFilters.cls==='ALL'||s.currentClass===certFilters.cls)
    && (certFilters.section==='ALL'||s.section===certFilters.section)
    && (certFilters.status==='ALL'||s.status===certFilters.status);
}

function certText(type, s){
  const pronoun = s.gender==='Female' ? 'she' : 'he';
  const Pronoun = s.gender==='Female' ? 'She' : 'He';
  const child = s.gender==='Female' ? 'daughter' : 'son';
  const name = U(s.name), fatherName = U(s.fatherName), cls = U(s.currentClass), sec = U(s.section), admissionDate = U(s.admissionDate);
  if(type==='character'){
    return `This is to certify that ${name}, ${child} of ${fatherName}, was/is a student of Class ${cls} (Section ${sec}) at ${SCHOOL_NAME}. During ${pronoun[0].toUpperCase()+pronoun.slice(1)}r time at this institution, ${pronoun} bore a good moral character and remained regular and disciplined in conduct.\n\nWe wish ${pronoun} success in all future endeavours.`;
  }
  if(type==='bonafide'){
    return `This is to certify that ${name}, ${child} of ${fatherName}, is a bonafide student of Class ${cls} (Section ${sec}) at ${SCHOOL_NAME}, bearing Roll No. ${s.grNo}. ${Pronoun} was admitted to this institution on ${admissionDate||'record on file'}.\n\nThis certificate is issued upon request for whatever purpose it may serve.`;
  }
  if(type==='leaving'){
    return `This is to certify that ${name}, ${child} of ${fatherName}, Roll No. ${s.grNo}, was a student of Class ${cls} (Section ${sec}) at ${SCHOOL_NAME}. ${Pronoun} was admitted on ${admissionDate||'record on file'} and ${s.status==='Pasout'?'has successfully completed studies at this institution':'has left this institution'}.\n\nDuring ${pronoun}s stay, ${pronoun} conduct and character remained satisfactory.`.replace('${pronoun}s','their');
  }
  return `This is to certify that ${name}, ${child} of ${fatherName}, Roll No. ${s.grNo}, is presently studying in Class ${cls} (Section ${sec}) at ${SCHOOL_NAME} for the academic session 2025-26.`;
}

  if(status==='Dropout') return 'droppedOut';
  if(status==='Promoted' || status==='Pasout') return 'alreadyAdmitted';
  return 'outOfSchool'; // NEW ENROLLMENT default
}

function generateCertificatesPDF(){
  if(!selected.size) return;
  const {jsPDF} = window.jspdf;
  const isLeaving = certType==='leaving';
  const isSlip = certType==='bispSlip';
  const ids = [...selected];

  if(isSlip){
    const doc = new jsPDF({unit:'pt', format:'a4', orientation:'portrait'});
    for(let i=0; i<ids.length; i+=4){
      if(i>0) doc.addPage();
      drawBispSlipsPage(doc, ids.slice(i, i+4));
    }
    doc.save(`BISP_Verification_Slips.pdf`);
    showToast(`Generated ${ids.length} slip(s) across ${Math.ceil(ids.length/4)} page(s)`);
    return;
  }

  const doc = new jsPDF({unit:'pt', format:'a4', orientation: isLeaving ? 'portrait' : 'landscape'});
  ids.forEach((grNo, idx)=>{
    if(idx>0) doc.addPage();
    if(isLeaving) drawLeavingCertificatePage(doc, grNo);
    else drawCertificatePage(doc, grNo);
  });
  doc.save(`${CERT_TYPES[certType].label.replace(/\s+/g,'_')}s.pdf`);
  showToast(`Generated ${ids.length} certificate(s)`);
}

/* BISP School/College Verification Slip — 4 slips per A4 page */
function drawBispSlipsPage(doc, grNoGroup){
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const marginX = 26, marginY = 26, gap = 14;
  const slipH = (pageH - marginY*2 - gap*3) / 4;
  const slipW = pageW - marginX*2;

  for(let i=0; i<4; i++){
    const grNo = grNoGroup[i] || null;
    const top = marginY + i*(slipH+gap);
    drawSingleBispSlip(doc, marginX, top, slipW, slipH, grNo);
  }
}

function drawSingleBispSlip(doc, x, y, w, h, grNo){
  const s = grNo ? STUDENTS.find(st=>st.grNo===grNo) : null;
  const L = grNo ? (slipStore[grNo] || { motherName:'', group:'', teacherName:'', teacherContact:'', admissionType: defaultAdmissionType(s.status) }) : {};

  // Dashed border box
  doc.setDrawColor(30,140,90); doc.setLineWidth(1.2);
  doc.setLineDashPattern([3,2], 0);
  doc.rect(x, y, w, h);
  doc.setLineDashPattern([], 0);

  const padX = 16;
  const fullLeft = x + padX;
  const fullRight = x + w - padX;
  const fullW = fullRight - fullLeft;

  // ---- Header: logo on the left, title centered across the full slip ----
  const logoSize = 34;
  let cy = y + 16 + logoSize*0.6;
  try{ doc.addImage(BISP_LOGO, imgFormat(BISP_LOGO), fullLeft, y+12, logoSize, logoSize); }catch(e){}
  doc.setFont('times','bold'); doc.setFontSize(13); doc.setTextColor(20);
  doc.text('SCHOOL/COLLEGE VERIFICATION SLIP', x + w/2, cy, {align:'center'});
  doc.setDrawColor(20); doc.setLineWidth(0.7);
  const titleW = doc.getTextWidth('SCHOOL/COLLEGE VERIFICATION SLIP');
  doc.line(x+w/2-titleW/2, cy+3, x+w/2+titleW/2, cy+3);

  const headerBottom = y + 12 + logoSize + 6;
  const rowH = (h - (headerBottom - y) - 12) / 6;

  function field(label, value, lx, ly, lineToX, fs){
    fs = fs || 8.8;
    doc.setFont('helvetica','normal'); doc.setFontSize(fs); doc.setTextColor(30);
    doc.text(label, lx, ly);
    const labelW = doc.getTextWidth(label);
    doc.setFont('helvetica','bold'); doc.setFontSize(fs+0.3); doc.setTextColor(10);
    const valX = lx+labelW+4;
    if(value){
      let vfs = fs+0.3;
      const maxW = lineToX - valX - 2;
      doc.setFontSize(vfs);
      while(vfs>6.5 && doc.getTextWidth(String(value))>maxW){ vfs-=0.4; doc.setFontSize(vfs); }
      doc.text(String(value), valX, ly-1.5);
    }
    doc.setDrawColor(90); doc.setLineWidth(0.5);
    doc.line(valX-2, ly+1.5, lineToX, ly+1.5);
  }

  // Row 1 (full width): Student / Father / Mother
  cy = headerBottom + rowH*0.85;
  let cw = fullW/3;
  field('Student Name:', s?U(s.name):'', fullLeft, cy, fullLeft+cw-10);
  field('Father Name:', s?U(s.fatherName):'', fullLeft+cw+6, cy, fullLeft+cw*2-10);
  field('Mother Name:', L.motherName?U(L.motherName):'', fullLeft+cw*2+6, cy, fullRight);

  // Row 2 (full width): School Name (wide) / EMIS Code
  cy += rowH;
  cw = fullW*0.62;
  field('School Name:', U(SCHOOL_NAME), fullLeft, cy, fullLeft+cw-10, 8.8);
  field('EMIS/College Code:', U(schoolSlipSettings.emisCode||SCHOOL_META.code), fullLeft+cw+6, cy, fullRight, 9.6);

  // Row 3 (full width): School Address (wide) / Tehsil
  cy += rowH;
  field('School Address:', U(schoolSlipSettings.schoolAddress||SCHOOL_META.village), fullLeft, cy, fullLeft+cw-10, 8.8);
  field('Tehsil:', s?U(s.taluka||SCHOOL_META.taluka):'', fullLeft+cw+6, cy, fullRight, 8.8);

  // From here down, reserve space on the right for the signature box (last 3 rows only)
  const sigBoxW = 116;
  const sigGap = 12;
  const sigBoxX = fullRight - sigBoxW;
  const textRight = sigBoxX - sigGap;

  // Row 4: Class boxes / Section / Group / GER — constrained width
  cy += rowH;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.7); doc.setTextColor(30);
  doc.text('Class:', fullLeft, cy);
  const clsVal = s ? U(s.currentClass) : '';
  doc.setDrawColor(90); doc.setLineWidth(0.6);
  doc.rect(fullLeft+26, cy-10, 16, 13);
  doc.rect(fullLeft+44, cy-10, 16, 13);
  if(clsVal){
    doc.setFont('helvetica','bold'); doc.setFontSize(8.5);
    doc.text(clsVal, fullLeft+52, cy-1, {align:'center'});
  }
  const secX = fullLeft+68, grpX = fullLeft+150, gerX = fullLeft+230;
  field('Sec:', s?U(s.section):'', secX, cy, grpX-10, 8.3);
  field('Group:', L.group?U(L.group):'', grpX, cy, gerX-10, 8.3);
  field('GER/Admission #:', s?s.grNo:'', gerX, cy, textRight, 7.8);

  // Row 5: four checkboxes — always blank (left for manual ticking, not auto-selected)
  cy += rowH;
  function checkBox(bx, by){
    doc.setDrawColor(90); doc.setLineWidth(0.6);
    doc.rect(bx, by-8, 9, 9);
  }
  doc.setFont('helvetica','normal'); doc.setFontSize(7.3); doc.setTextColor(30);
  const textW4 = textRight - fullLeft;
  const b1 = fullLeft, b2 = fullLeft+textW4*0.27, b3 = fullLeft+textW4*0.54, b4 = fullLeft+textW4*0.78;
  checkBox(b1, cy); doc.text('New Admission', b1+12, cy);
  checkBox(b2, cy); doc.text('Out of School', b2+12, cy);
  checkBox(b3, cy); doc.text('Dropped Out', b3+12, cy);
  checkBox(b4, cy); doc.text('Already Admitted', b4+12, cy);

  // Row 6: Teacher Name / Contact — constrained width
  cy += rowH;
  cw = (textRight-fullLeft)*0.55;
  field('Teacher Name:', L.teacherName?U(L.teacherName):'', fullLeft, cy, fullLeft+cw-8, 8.3);
  field('Teacher Contact:', L.teacherContact?U(L.teacherContact):'', fullLeft+cw+8, cy, textRight, 8.3);

  // Signature box — sits below the checkbox row only, shorter so it doesn't touch the line above
  doc.setDrawColor(60); doc.setLineWidth(0.7);
  const sigTop = headerBottom + rowH*4 + rowH*0.15;
  const sigBottom = y + h - 8;
  doc.rect(sigBoxX, sigTop, sigBoxW, sigBottom-sigTop);
  doc.setFont('times','italic'); doc.setFontSize(9); doc.setTextColor(150);
  doc.text('Signature:', sigBoxX+sigBoxW/2, sigBottom-10, {align:'center'});
}

/* Exact School Leaving Certificate format (matches the school's official S.L.C template) */
const ORDINAL_WORDS = ['First','Second','Third','Fourth','Fifth','Sixth','Seventh','Eighth','Ninth','Tenth',
  'Eleventh','Twelfth','Thirteenth','Fourteenth','Fifteenth','Sixteenth','Seventeenth','Eighteenth','Nineteenth','Twentieth',
  'Twenty-First','Twenty-Second','Twenty-Third','Twenty-Fourth','Twenty-Fifth','Twenty-Sixth','Twenty-Seventh','Twenty-Eighth','Twenty-Ninth','Thirtieth','Thirty-First'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ONES_WORDS = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const TENS_WORDS = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];

function numberToWords(n){
  n = Math.floor(n);
  if(n===0) return 'Zero';
  if(n<20) return ONES_WORDS[n];
  if(n<100) return TENS_WORDS[Math.floor(n/10)] + (n%10 ? '-'+ONES_WORDS[n%10] : '');
  if(n<1000) return ONES_WORDS[Math.floor(n/100)]+' Hundred' + (n%100 ? ' '+numberToWords(n%100) : '');
  if(n<1000000) return numberToWords(Math.floor(n/1000))+' Thousand' + (n%1000 ? ' '+numberToWords(n%1000) : '');
  return String(n);
}

function dobToWords(dobStr){
  if(!dobStr) return '';
  const parts = dobStr.split('-');
  if(parts.length!==3) return '';
  const dd = +parts[0], mm = +parts[1], yyyy = +parts[2];
  if(!dd || !mm || !yyyy) return '';
  const dayW = ORDINAL_WORDS[dd-1] || '';
  const monthW = MONTH_NAMES[mm-1] || '';
  const yearW = numberToWords(yyyy);
  return `${dayW} ${monthW} ${yearW}`.toUpperCase();
}

function drawLeavingCertificatePage(doc, grNo){

    doc.setDrawColor(120); doc.setLineWidth(0.6);
    doc.line(VAL1_X-6, y+2, lineEndX, y+2);
    y += rowH;
  }

  function formFieldDual(label1, value1, label2, value2, midX){
    const mid = midX || MID_X;
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5); doc.setTextColor(30);

      while(fs > 7.5 && doc.getTextWidth(String(value2)) > maxW){ fs -= 0.5; doc.setFontSize(fs); }
      doc.text(String(value2), val2X, y-2);
    }
    doc.line(val2X-4, y+2, lineEndX, y+2);

  doc.text('Principal / Head of School', pageW-marginX-85, y+15, {align:'center'});
}

function romanClassLabel(roman){
  const names = { VI:'SIXTH (VI)', VII:'SEVENTH (VII)', VIII:'EIGHTH (VIII)', IX:'NINTH (IX)', X:'TENTH (X)' };

}

  doc.line(pageW/2-90, y, pageW/2+90, y); y+=34;

  doc.setFont('times','bold'); doc.setFontSize(19); doc.setTextColor(184,134,59);
  doc.text(CERT_TYPES[certType].label.toUpperCase(), pageW/2, y, {align:'center'}); y+=44;

  doc.setFont('times','normal'); doc.setFontSize(12.5); doc.setTextColor(35);
  const body = certText(certType, s);
  const lines = doc.splitTextToSize(body, pageW-190);
  doc.text(lines, pageW/2, y, {align:'center', lineHeightFactor:1.6});
  y += lines.length*20 + 34;

  doc.setFontSize(10.5); doc.setTextColor(90);
  doc.text(`Roll No: ${s.grNo}`, 95, y);
  doc.text(`Date: ${new Date().toLocaleDateString('en-GB')}`, pageW-95, y, {align:'right'});
  y += 60;

  doc.setDrawColor(150); doc.setLineWidth(0.6);
  doc.line(95, y, 245, y);
  doc.line(pageW-245, y, pageW-95, y);
  doc.setFontSize(9.5); doc.setTextColor(90);
  doc.text('Class Teacher', 170, y+15, {align:'center'});
  doc.text('Principal / Head of School', pageW-170, y+15, {align:'center'});

  if(photos[grNo]){
    try{ doc.addImage(photos[grNo], imgFormat(photos[grNo]), pageW-150, 95, 60, 60); }catch(e){}
  }
}

function imgFormat(dataUrl){
  if(dataUrl.startsWith('data:image/png')) return 'PNG';
  if(dataUrl.startsWith('data:image/webp')) return 'WEBP';
  return 'JPEG';
}

/* ============ INIT ============ */
loadStorage();

/* Register service worker for offline support — only works when hosted (http/https), not from a local file:// path */
if('serviceWorker' in navigator && (location.protocol==='https:' || location.protocol==='http:')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{ /* not hosted yet — fine, app still works */ });
  });
}

</script>
